<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Player</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f111a;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .player-card {
            background: linear-gradient(145deg, #1e2235, #141724);
            border: 1px solid #2d334d;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        .album-art-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto;
        }
        .album-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 2px solid #3b4261;
        }
        .live-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: #ef4444;
            color: white;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 50px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
            animation: pulse 2s infinite;
        }
        .btn-play {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #3b82f6;
            border: none;
            color: white;
            font-size: 1.8rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .btn-play:hover {
            background-color: #2563eb;
            transform: scale(1.05);
        }
        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 50px;
            background: #2d334d;
            outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            transition: background 0.15s ease-in-out;
        }
        .volume-slider::-webkit-slider-thumb:hover {
            background: #60a5fa;
        }
        .text-muted-custom {
            color: #94a3b8;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5 text-center">
            
            <!-- Radio Player Card -->
            <div class="player-card p-4 p-sm-5 mb-4">
                
                <!-- Album Artwork / Live Indicator -->
                <div class="album-art-wrapper mb-4">
                    <img id="album-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&auto=format&fit=crop&q=60" alt="Album Art" class="album-art">
                    <span class="live-badge d-none" id="live-indicator">Live</span>
                </div>

                <!-- Track Info Metadata -->
                <div class="metadata-container mb-4">
                    <h3 id="track-title" class="fs-4 fw-bold mb-1 text-truncate">Loading Stream...</h3>
                    <p id="track-artist" class="fs-6 text-muted-custom mb-0 text-truncate">Please wait</p>
                </div>

                <!-- Main Audio Element -->
                <audio id="radio-audio" preload="none"></audio>

                <!-- Action Controls -->
                <div class="controls-container d-flex align-items-center justify-content-center gap-4 mb-4">
                    <button class="btn-play" id="play-btn" aria-label="Play">
                        <i class="bi bi-play-fill" id="play-icon"></i>
                    </button>
                </div>

                <!-- Volume Row -->
                <div class="volume-container d-flex align-items-center justify-content-center gap-3 mx-auto" style="max-width: 240px;">
                    <i class="bi bi-volume-down-fill text-muted-custom fs-5" id="volume-icon"></i>
                    <input type="range" class="volume-slider" id="volume-control" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
                </div>

            </div>

            <!-- Station Brand Footer -->
            <p class="small text-muted-custom mb-0">Powered by AzuraCast API & Cloudflare Pages</p>
            
        </div>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // --- Configuration ---
    // Replace with your exact AzuraCast stream URL and API endpoint
    const STREAM_URL = 'https://demo.azuracast.com/radio/8010/radio.mp3';
    const API_URL = 'https://demo.azuracast.com/api/nowplaying_minimal/radio';
    const POLL_INTERVAL = 15000; // 15 seconds

    // --- DOM Elements ---
    const audio = document.getElementById('radio-audio');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const volumeControl = document.getElementById('volume-control');
    const volumeIcon = document.getElementById('volume-icon');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const albumArt = document.getElementById('album-art');
    const liveIndicator = document.getElementById('live-indicator');

    // --- State Variables ---
    let isPlaying = false;

    // --- Audio Player Logic ---
    function togglePlay() {
        if (!isPlaying) {
            // Buffer flushing logic: force fresh stream chunks on click
            audio.src = STREAM_URL + '?nocache=' + Date.now();
            audio.load();
            
            audio.play()
                .then(() => {
                    isPlaying = true;
                    playIcon.className = 'bi bi-pause-fill';
                    liveIndicator.classList.remove('d-none');
                })
                .catch(err => {
                    console.error("Playback failed:", err);
                });
        } else {
            audio.pause();
            // Disconnect source completely to stop data downloading in background
            audio.src = '';
            isPlaying = false;
            playIcon.className = 'bi bi-play-fill';
            liveIndicator.classList.add('d-none');
        }
    }

    // --- Volume Management ---
    function handleVolumeChange(e) {
        const val = e.target.value;
        audio.volume = val;
        
        // Dynamic volume icons
        if (val == 0) {
            volumeIcon.className = 'bi bi-volume-mute-fill text-danger';
        } else if (val < 0.4) {
            volumeIcon.className = 'bi bi-volume-down-fill text-muted-custom';
        } else {
            volumeIcon.className = 'bi bi-volume-up-fill text-muted-custom';
        }
    }

    // --- Fetch Metadata (API Polling) ---
    async function updateMetadata() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Network response failure');
            
            const data = await response.json();
            
            // Extract fields from AzuraCast minimum/standard now-playing payload
            const currentSong = data.now_playing?.song;
            
            if (currentSong) {
                trackTitle.textContent = currentSong.title || 'Unknown Title';
                trackArtist.textContent = currentSong.artist || 'Unknown Artist';
                
                // Fallback to stock image if artwork is missing or default
                if (currentSong.art && !currentSong.art.includes('generic')) {
                    albumArt.src = currentSong.art;
                } else {
                    albumArt.src = 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&auto=format&fit=crop&q=60';
                }
            }
        } catch (error) {
            console.warn('Metadata fetch failed:', error);
            // Gracefully keep current layout if API temporary drops
        }
    }

    // --- Event Listeners & Initialization ---
    playBtn.addEventListener('click', togglePlay);
    volumeControl.addEventListener('input', handleVolumeChange);
    
    // Set initial volume
    audio.volume = volumeControl.value;

    // Run first metadata query immediately, then pull on interval
    updateMetadata();
    setInterval(updateMetadata, POLL_INTERVAL);
</script>
</body>
</html>
