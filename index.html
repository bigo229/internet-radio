<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Radio - Live Stream</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #11111d 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .player-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }
        .album-art {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .play-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            transition: transform 0.2s;
        }
        .play-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            
            <!-- Radio Player Card -->
            <div class="player-card p-4 text-center shadow-lg">
                <h2 class="h4 mb-3 text-uppercase tracking-wider text-muted" id="station-name">Loading Station...</h2>
                
                <!-- Album Art -->
                <div class="my-4">
                    <img id="album-art" src="https://unsplash.com" alt="Album Art" class="album-art">
                </div>

                <!-- Track Info -->
                <div class="mb-4">
                    <h3 class="h5 mb-1 text-truncate" id="track-title">Live Broadcast</h3>
                    <p class="text-muted mb-0 text-truncate" id="track-artist">Please press play</p>
                </div>

                <!-- Audio Element -->
                <audio id="radio-player" preload="none"></audio>

                <!-- Controls -->
                <div class="d-flex justify-content-center align-items-center mb-3">
                    <button class="btn btn-primary play-btn shadow" id="play-toggle" onclick="togglePlayback()">
                        <i class="bi bi-play-fill" id="play-icon"></i>
                    </button>
                </div>

                <!-- Live Listener Count Badge -->
                <div class="mt-3">
                    <span class="badge bg-danger rounded-pill px-3 py-2">
                        <i class="bi bi-broadcast me-1"></i> LIVE: <span id="listeners">0</span> Listeners
                    </span>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Stream Logic API JavaScript -->
<script>
    // Configuration: Replace with your actual AzuraCast details
    const AZURACAST_URL = "https://az1.cheapshoutcast365.co.uk"; 
    const STATION_SHORTCODE = "cheapshoutcast365_radio-70s,80s,90s,00s_v2_8040"; 

    // DOM Elements
    const player = document.getElementById('radio-player');
    const playToggle = document.getElementById('play-toggle');
    const playIcon = document.getElementById('play-icon');
    const stationName = document.getElementById('station-name');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const albumArt = document.getElementById('album-art');
    const listenersCount = document.getElementById('listeners');

    let streamUrl = "";
    let isPlaying = false;

    // Connect to AzuraCast Server Sent Events (SSE) for Real-time Data
    function connectSse() {
        const sseUrl = `${AZURACAST_URL}/api/live/nowplaying/sse?listen_to=${STATION_SHORTCODE}`;
        const eventSource = new EventSource(sseUrl);

        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const station = data.station;
            const nowPlaying = data.now_playing;

            // Update DOM with live metadata
            stationName.innerText = station.name;
            trackTitle.innerText = nowPlaying.song.title;
            trackArtist.innerText = nowPlaying.song.artist;
            albumArt.src = nowPlaying.song.art ? nowPlaying.song.art : albumArt.src;
            listenersCount.innerText = data.listeners.total;

            // Set the audio stream URL dynamically via Proxied Mount URL
            if (!streamUrl && station.mounts.length > 0) {
                streamUrl = station.mounts[0].url;
                player.src = streamUrl;
            }
        };

        eventSource.onerror = function() {
            console.log("SSE connection lost. Reconnecting...");
        };
    }

    // Toggle Play/Pause Functionality
    function togglePlayback() {
        if (!isPlaying) {
            // Reload stream asset to prevent playing old cached audio buffer
            player.src = streamUrl; 
            player.play()
                .then(() => {
                    isPlaying = true;
                    playIcon.className = "bi bi-pause-fill";
                    playToggle.classList.replace('btn-primary', 'btn-danger');
                })
                .catch(err => console.error("Playback failed:", err));
        } else {
            player.pause();
            player.src = ""; // Flush stream buffer
            isPlaying = false;
            playIcon.className = "bi bi-play-fill";
            playToggle.classList.replace('btn-danger', 'btn-primary');
        }
    }

    // Initialize Metadata Pull on Load
    connectSse();
</script>

<script src="https://jsdelivr.net"></script>
</body>
</html>
