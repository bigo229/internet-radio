<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Radio - Live Stream</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
        }
        .hero-section {
            background: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);
            border-bottom: 1px solid #334155;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
        }
        .card-header {
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
            font-weight: 600;
        }
        .btn-primary {
            background-color: #6366f1;
            border-color: #6366f1;
        }
        .btn-primary:hover {
            background-color: #4f46e5;
            border-color: #4f46e5;
        }
        iframe {
            border: none;
            border-radius: 8px;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand text-info" href="#"><i class="fa-solid fa-radio me-2"></i>CLOUD RADIO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-index"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#listen"><i class="fa-solid fa-play me-1"></i> Listen Live</a></li>
                    <li class="nav-item"><a class="nav-link" href="#request"><i class="fa-solid fa-music me-1"></i> Request Song</a></li>
                    <li class="nav-item"><a class="nav-link" href="#history"><i class="fa-solid fa-history me-1"></i> History</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero / Now Playing Section -->
    <header id="listen" class="hero-section py-5 text-center">
        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <span class="badge bg-danger mb-3 px-3 py-2 text-uppercase tracking-wider"><i class="fa-solid fa-circle-dot me-1 fa-pulse"></i> Live Broadcast</span>
                    <h1 class="display-4 fw-bold mb-4">Welcome to Cloud Radio</h1>
                    
                    <!-- AzuraCast Now Playing Player Widget -->
                    <div class="p-3 bg-dark bg-opacity-50 rounded-3 shadow border border-secondary mb-4">
                        <!-- INSTRUCTION: Replace 'demo.azuracast.com' and 'radio' with your AzuraCast domain and station shortcode -->
                        <iframe src="https://az1.cheapshoutcast365.co.uk/public/cheapshoutcast365_radio-70s,80s,90s,00s_v2_8040/embed" frameborder="0" allowtransparency="true" style="width: 100%; min-height: 150px; border: 0;"></iframe>
                    </div>
                    
                    <p class="lead text-muted">Streaming the finest beats 24/7 directly from the cloud.</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Section -->
    <main class="container my-5">
        <div class="row g-4">
            
            <!-- Song Request Widget Column -->
            <section id="request" class="col-lg-7">
                <div class="card h-100 shadow-sm">
                    <div class="card-header text-info d-flex align-items-center">
                        <i class="fa-solid fa-microphone-lines me-2"></i>
                        <h5 class="mb-0">Request a Song</h5>
                    </div>
                    <div class="card-body p-0">
                        <!-- AzuraCast Song Request Widget -->
                        <!-- INSTRUCTION: Replace 'demo.azuracast.com' and 'radio' with your AzuraCast domain and station shortcode -->
                        <iframe src="https://az1.cheapshoutcast365.co.uk/public/cheapshoutcast365_radio-70s,80s,90s,00s_v2_8040/embed-requests?theme=dark" frameborder="0" allowtransparency="true" style="width: 100%; min-height: 500px; border: 0;"></iframe>
                    </div>
                </div>
            </section>

            <!-- Song History Widget Column -->
            <section id="history" class="col-lg-5">
                <div class="card h-100 shadow-sm">
                    <div class="card-header text-warning d-flex align-items-center">
                        <i class="fa-solid fa-clock-rotate-left me-2"></i>
                        <h5 class="mb-0">Recently Played</h5>
                    </div>
                    <div class="card-body p-0">
                        <!-- AzuraCast Song History Widget -->
                        <!-- INSTRUCTION: Replace 'demo.azuracast.com' and 'radio' with your AzuraCast domain and station shortcode -->
                        <iframe src="https://az1.cheapshoutcast365.co.uk/public/cheapshoutcast365_radio-70s,80s,90s,00s_v2_8040/history?theme=dark" frameborder="0" allowtransparency="true" style="width: 100%; min-height: 500px; border: 0;"></iframe>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-muted py-4 border-top border-secondary text-center">
        <div class="container">
            <p class="mb-1">&copy; 2026 Cloud Radio Station. All Rights Reserved.</p>
            <p class="small text-secondary">Powered by <a href="https://www.azuracast.com" target="_blank" class="text-info text-decoration-none">AzuraCast</a> & Hosted on <a href="https://pages.cloudflare.com" target="_blank" class="text-warning text-decoration-none">Cloudflare Pages</a>.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
